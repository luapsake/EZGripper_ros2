# Individual Joint Position Controllers for EZGripper
# Each controller defines a single joint to match the SCARA arm format
# Joint names must match exactly with the TF tree frame IDs

# Single gripper joints with left_arm prefix to match the TF tree
gripper_finger_L1_1_controller:
  ros__parameters:
    type: position_controllers/JointPositionController
    joint: left_arm_ezgripper_knuckle_palm_L1_1
    interface_name: position
    publish_rate: 50  # Hz

gripper_finger_L1_2_controller:
  ros__parameters:
    type: position_controllers/JointPositionController
    joint: left_arm_ezgripper_knuckle_palm_L1_2
    interface_name: position
    publish_rate: 50  # Hz

