components:
  ezgripper:
    joint_states_topic: '/ezgripper/joint_states'
    namespace: 'ezgripper'
    parameters:
      use_sim_time: false
      publish_frequency: 30.0  # Hz
    joints:
      # Single gripper joints
      - name: ezgripper_knuckle_palm_L1_1
        command_topic: '/ezgripper/left_ezgripper/command'
        state_topic: '/ezgripper/left_ezgripper/state'
        type: position
      - name: ezgripper_knuckle_palm_L1_2
        command_topic: '/ezgripper/left_ezgripper/command'
        state_topic: '/ezgripper/left_ezgripper/state'
        type: position
        
      # Triple gripper joints - first gripper
      - name: gripper1_ezgripper_knuckle_palm_L1_1
        command_topic: '/ezgripper/left_gripper1_ezgripper/command'
        state_topic: '/ezgripper/left_gripper1_ezgripper/state'
        type: position
      - name: gripper1_ezgripper_knuckle_palm_L1_2
        command_topic: '/ezgripper/left_gripper1_ezgripper/command'
        state_topic: '/ezgripper/left_gripper1_ezgripper/state'
        type: position
        
      # Triple gripper joints - second gripper
      - name: gripper2_ezgripper_knuckle_palm_L1_1
        command_topic: '/ezgripper/left_gripper2_ezgripper/command'
        state_topic: '/ezgripper/left_gripper2_ezgripper/state'
        type: position
      - name: gripper2_ezgripper_knuckle_palm_L1_2
        command_topic: '/ezgripper/left_gripper2_ezgripper/command'
        state_topic: '/ezgripper/left_gripper2_ezgripper/state'
        type: position
        
      # Triple gripper joints - third gripper
      - name: gripper3_ezgripper_knuckle_palm_L1_1
        command_topic: '/ezgripper/left_gripper3_ezgripper/command'
        state_topic: '/ezgripper/left_gripper3_ezgripper/state'
        type: position
      - name: gripper3_ezgripper_knuckle_palm_L1_2
        command_topic: '/ezgripper/left_gripper3_ezgripper/command'
        state_topic: '/ezgripper/left_gripper3_ezgripper/state'
        type: position
